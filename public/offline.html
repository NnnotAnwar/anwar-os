<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121022" media="(prefers-color-scheme: dark)" />
    <title>Offline · anwar.os</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <!--
      Shown by the service worker (public/sw.js) when a page can't be reached.
      Self-contained: no scripts, no network. Planuj Glass tokens copied from
      src/app/globals.css. Served with a strict CSP from next.config.ts.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas-from: #f8f7fc;
        --canvas-to: #eeecf7;
        --glass: rgba(255, 255, 255, 0.62);
        --hairline: rgba(27, 26, 46, 0.06);
        --fg: #1b1a2e;
        --muted: #66637f;
        --accent: #4f46e5;
        --shadow: 0 1px 2px rgb(27 26 46 / 0.05), 0 28px 56px -24px color-mix(in srgb, #4f46e5 34%, transparent);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-from: #0d0c17;
          --canvas-to: #1a1730;
          --glass: rgba(30, 27, 56, 0.6);
          --hairline: rgba(255, 255, 255, 0.08);
          --fg: #ecebf7;
          --muted: #a19fbd;
          --accent: #a5b4fc;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        background: linear-gradient(160deg, var(--canvas-from), var(--canvas-to));
        color: var(--fg);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 22rem;
        display: grid;
        gap: 16px;
        padding: 24px;
        border-radius: 16px;
        background: var(--glass);
        border: 1px solid var(--hairline);
        box-shadow: var(--shadow);
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
      }
      svg {
        width: 48px;
        height: 48px;
      }
      p.eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      nav a {
        background: transparent;
        border: 1px solid var(--hairline);
        color: var(--accent);
      }
      a:focus-visible {
        outline: 3px solid color-mix(in srgb, #6366f1 50%, transparent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset="1" stop-color="#4338ca" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bg)" />
        <g transform="translate(14 -12)">
          <circle cx="210" cy="268" r="86" fill="none" stroke="#fff" stroke-width="46" />
          <rect x="273" y="159" width="46" height="218" rx="23" fill="#fff" />
          <circle cx="370" cy="352" r="25" fill="#c7d2fe" />
        </g>
      </svg>
      <p class="eyebrow">No connection</p>
      <h1>You're offline</h1>
      <p>
        This page isn't saved on this device yet. Pages you've opened before work offline, and anything you
        capture there waits on this device until you're back online.
      </p>
      <a href="/app">Try again</a>
      <nav aria-label="Saved pages">
        <a href="/app/inbox">Inbox</a>
        <a href="/app/tasks">Tasks</a>
        <a href="/app/notes">Notes</a>
        <a href="/app/budget">Budget</a>
      </nav>
    </main>
  </body>
</html>

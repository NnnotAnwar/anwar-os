# Local development services. Production lives in infra/compose.prod.yml.
#   docker compose up -d db      start Postgres on localhost:55432
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: anwar_os
      OS_APP_PASSWORD: ${OS_APP_PASSWORD:-os_app}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anwar_os"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:

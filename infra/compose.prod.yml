# anwar.os production stack. Lives on the server at /opt/anwar-os/repo/infra/
# (a checkout of this repo) next to a private .env — see infra/.env.example and
# docs/DEPLOY.md. Run every command from this directory:
#
#   docker compose -f compose.prod.yml up -d          first start (migrates, then web)
#   ./deploy.sh <git-sha>                             normal deploy / rollback
#
# The server can host more than one project: ports 80/443 belong to the shared
# edge stack (infra/edge: one Caddy for every domain). This stack publishes no
# ports; deploy.sh writes its site file to /opt/edge/sites and reloads Caddy.
# Memory limits keep one project from starving the others.
#
# Networks
#   edge      the shared, external network (docker network create edge). Only
#             web joins it, under the alias `anwar-os-web`, which is what the
#             edge Caddy proxies to. Not internal: web needs outbound APIs
#             (object storage, Telegram, mail).
#   internal  web/migrate/bots <-> db, and osbot -> web over HTTP. `internal:
#             true` = no route to the internet; Postgres is never published.
#   egress    outbound-only network for bots (Telegram API). Nothing listens on it.
#
# Profiles
#   bots      the Telegram bots. Off until configured: set COMPOSE_PROFILES=bots
#             in .env (docs/DEPLOY.md, "Expense bot", "Connect osbot").
#   ops       ops-agent, the control panel's Docker agent. COMPOSE_PROFILES=bots,ops
#             (docs/DEPLOY.md, "Control panel").
#
# Labels (read by ops-agent, ARCHITECTURE.md §8)
#   os.managed=true     shows up in the control panel (status, logs, restart)
#   os.protected=true   visible, but the panel refuses stop/deploy for it
#   os.role=<role>      grouping for the panel: edge | app | data | bot
#   os.kind, os.name    set by bot images too (os.kind=bot, os.name=expenses|osbot)
# One-shot jobs (migrate) carry os.managed=false so the panel ignores them.

name: anwar-os

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  web:
    image: ghcr.io/nnnotanwar/anwar-os-web:${WEB_TAG:-latest}
    restart: unless-stopped
    init: true # reap zombies, forward SIGTERM so Next drains in-flight requests
    stop_grace_period: 30s
    <<: *hardening
    cap_drop:
      - ALL
    mem_limit: 1g
    environment:
      NODE_ENV: production
      # Passwords are hex (openssl rand -hex 32), so they're URL-safe here.
      DATABASE_URL: postgres://os_app:${OS_APP_PASSWORD:?set OS_APP_PASSWORD in .env}@db:5432/anwar_os
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: https://${DOMAIN:?set DOMAIN in .env}
      # Optional Google sign-in (empty = hidden). Passkeys need nothing extra:
      # their relying party ID is the hostname of BETTER_AUTH_URL.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      # Hetzner Object Storage for the files module (phase 4). Unused until then.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # osbot (bots/osbot). OSBOT_API_SECRET turns on the signed internal API
      # (/api/internal/osbot/*) the bot calls; token + chat id are the direct
      # feedback-alert fallback while the bot is down or not deployed.
      OSBOT_API_SECRET: ${OSBOT_API_SECRET:-}
      OSBOT_TOKEN: ${OSBOT_TOKEN:-}
      OSBOT_OWNER_CHAT_ID: ${OSBOT_OWNER_CHAT_ID:-}
      # Control panel (/app/ops). Empty URL = "Control panel not connected".
      OPS_AGENT_URL: ${OPS_AGENT_URL:-}
      OPS_AGENT_SECRET: ${OPS_AGENT_SECRET:-}
      # Deploy dialog: image tags from GHCR + commit messages from GitHub.
      # Optional token (read:packages) for private packages / higher rate limits.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-NnnotAnwar/anwar-os}
    expose:
      - "3000"
    networks:
      edge:
        # Unique across projects: the edge Caddy proxies to anwar-os-web:3000.
        aliases: [anwar-os-web]
      internal: {}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Same probe as the image HEALTHCHECK (200 only when Postgres answers),
      # with fast polling while starting so `up --wait` (the deploy gate)
      # returns quickly.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging: *logging
    labels:
      os.managed: "true"
      os.protected: "true"
      os.role: app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *hardening
    mem_limit: 1536m
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: anwar_os
      # Read by db/init/01-roles.sh on first start (empty data dir) to create the
      # os_app login role (no superuser, no BYPASSRLS).
      OS_APP_PASSWORD: ${OS_APP_PASSWORD:?set OS_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts only run when the data directory is empty (first start or
      # a rebuilt server before restore).
      - ../db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anwar_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    logging: *logging
    labels:
      os.managed: "true"
      os.protected: "true"
      os.role: data

  # One-shot: applies pending Drizzle migrations (db/migrations) as `postgres`,
  # then exits. Runs before web on `up` (web waits for it to complete), and
  # explicitly via `docker compose run --rm migrate` in deploy.sh, so a failed
  # migration stops the deploy before the new web container replaces the old.
  # Same image runs `pnpm owner:create` (docs/DEPLOY.md, "First owner").
  migrate:
    image: ghcr.io/nnnotanwar/anwar-os-migrate:${WEB_TAG:-latest}
    restart: "no"
    <<: *hardening
    mem_limit: 768m
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/anwar_os
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    labels:
      os.managed: "false"

  # Expense bot (bots/expenses/README.md). Long polling, nothing exposed: it
  # reaches Postgres on `internal` and Telegram on `egress`. Its role + schema
  # come from bots/expenses/db/bootstrap.sql, which deploy.sh re-applies
  # (idempotent) before starting it; the bot migrates its own tables.
  bot-expenses:
    image: ghcr.io/nnnotanwar/anwar-os-bot-expenses:${BOT_EXPENSES_TAG:-latest}
    profiles: [bots]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # heartbeat file read by the image HEALTHCHECK
    cap_drop:
      - ALL
    <<: *hardening
    # Python + aiogram + asyncpg settle around 110 MB; 128m kept them at the
    # cgroup ceiling (constant reclaim into swap). 256m leaves headroom.
    mem_limit: 256m
    stop_grace_period: 15s
    environment:
      # Not `:?` on purpose: compose interpolates every service even when its
      # profile is off, and the stack must start before the bot is configured.
      BOT_TOKEN: ${BOT_EXPENSES_TOKEN:-}
      DATABASE_URL: postgresql://bot_expenses:${BOT_EXPENSES_DB_PASSWORD:-}@db:5432/anwar_os
    networks:
      - internal
      - egress
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    labels:
      os.managed: "true"
      os.kind: bot
      os.name: expenses
      os.role: bot

  # osbot (bots/osbot/README.md): the platform's own Telegram bot. No database
  # access at all: it calls web's signed internal API over `internal`
  # (http://web:3000, never through Caddy) and Telegram over `egress`.
  # deploy.sh only starts it once OSBOT_TOKEN, OSBOT_API_SECRET and
  # OSBOT_OWNER_CHAT_ID are set.
  bot-osbot:
    image: ghcr.io/nnnotanwar/anwar-os-bot-osbot:${BOT_OSBOT_TAG:-latest}
    profiles: [bots]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # heartbeat file read by the image HEALTHCHECK
    cap_drop:
      - ALL
    <<: *hardening
    # Python + aiogram + asyncpg settle around 110 MB; 128m kept them at the
    # cgroup ceiling (constant reclaim into swap). 256m leaves headroom.
    mem_limit: 256m
    stop_grace_period: 15s
    environment:
      # Not `:?`: compose interpolates every service even when its profile is off.
      BOT_TOKEN: ${OSBOT_TOKEN:-}
      OSBOT_API_URL: http://web:3000
      OSBOT_API_SECRET: ${OSBOT_API_SECRET:-}
      OSBOT_OWNER_CHAT_ID: ${OSBOT_OWNER_CHAT_ID:-}
    networks:
      - internal
      - egress
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    labels:
      os.managed: "true"
      os.kind: bot
      os.name: osbot
      os.role: bot

  # Control panel agent (services/ops-agent, ARCHITECTURE.md §8): the ONLY
  # container with the Docker socket. Reachable on `internal` only, from web,
  # with HMAC-signed requests (OPS_AGENT_SECRET); never published. It doesn't
  # need the internet: image pulls are done by the Docker daemon.
  # Profile `ops`: add it to COMPOSE_PROFILES once OPS_AGENT_SECRET is set.
  ops-agent:
    image: ghcr.io/nnnotanwar/anwar-os-ops-agent:${OPS_AGENT_TAG:-latest}
    profiles: [ops]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    <<: *hardening
    mem_limit: 64m
    # Runs as 65532 (image USER); the socket's group grants it Docker access.
    # deploy.sh exports DOCKER_GID from the socket; set it in .env for manual runs.
    group_add:
      - "${DOCKER_GID:-999}"
    stop_grace_period: 5m # lets a running deploy finish or roll back
    environment:
      OPS_AGENT_SECRET: ${OPS_AGENT_SECRET:-}
      # Compose projects whose os.managed=true containers the panel sees. The
      # first is primary (plain names: "web"); others are qualified
      # ("edge.caddy", "shiftella.web"). Add a project here to manage it.
      OPS_AGENT_PROJECTS: ${OPS_AGENT_PROJECTS:-anwar-os,edge}
      OPS_AGENT_DEPLOY_TIMEOUT: ${OPS_AGENT_DEPLOY_TIMEOUT:-240}
      # Optional: pull private GHCR packages (a PAT with read:packages).
      OPS_AGENT_REGISTRY_USER: ${OPS_AGENT_REGISTRY_USER:-}
      OPS_AGENT_REGISTRY_TOKEN: ${OPS_AGENT_REGISTRY_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    networks:
      - internal
    logging: *logging
    labels:
      os.managed: "true"
      os.protected: "true"
      os.role: edge

networks:
  edge:
    external: true
    name: edge
  internal:
    internal: true
  egress: {}

volumes:
  pgdata: {}

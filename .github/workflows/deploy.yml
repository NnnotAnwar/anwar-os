name: Deploy

# push to main -> build the web, migrate, bot-expenses and bot-osbot images for linux/arm64
# (the server, a Hetzner CAX21) and linux/amd64 on native runners -> push to GHCR
# as :<sha> and :latest -> SSH to the server and run infra/deploy.sh <sha>
# (migrate, replace web, healthcheck gate, auto-rollback, then the bots that
# are configured, if their compose profile is on).
#
# The deploy job is skipped until the DEPLOY_* secrets exist, so this workflow
# stays green before the server does. See docs/DEPLOY.md.
#
# Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (required to deploy)
#            DEPLOY_KNOWN_HOSTS (recommended: `ssh-keyscan -t ed25519 HOST` output,
#            verified once by hand; without it the host key is trusted on first use)
#            DEPLOY_PORT (optional, default 22)
# Variables: PUBLIC_URL (optional, e.g. https://anwar.example) for a smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Redeploy an existing build (full or short commit sha on main) instead of building HEAD. Use for rollbacks."
        required: false
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/nnnotanwar/anwar-os-web
  MIGRATE_IMAGE: ghcr.io/nnnotanwar/anwar-os-migrate
  BOT_EXPENSES_IMAGE: ghcr.io/nnnotanwar/anwar-os-bot-expenses
  BOT_OSBOT_IMAGE: ghcr.io/nnnotanwar/anwar-os-bot-osbot

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      deploy: ${{ steps.plan.outputs.deploy }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - id: plan
        env:
          INPUT_SHA: ${{ inputs.sha }}
          HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            if ! printf '%s' "$INPUT_SHA" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::sha must be 7-40 lowercase hex characters"; exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_SECRETS" = true ] && [ "$IS_MAIN" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped (needs main + DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY secrets)."
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform is pushed by digest only; the merge job stitches the two
      # digests into one multi-arch tag.
      - name: Build web (${{ matrix.platform }})
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

      - name: Build migrate (${{ matrix.platform }})
        id: migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.MIGRATE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      - name: Build bot-expenses (${{ matrix.platform }})
        id: bot
        uses: docker/build-push-action@v6
        with:
          context: bots/expenses
          platforms: ${{ matrix.platform }}
          build-args: |
            BOT_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.BOT_EXPENSES_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bot-expenses-${{ matrix.arch }}
          cache-to: type=gha,scope=bot-expenses-${{ matrix.arch }},mode=max

      - name: Build bot-osbot (${{ matrix.platform }})
        id: osbot
        uses: docker/build-push-action@v6
        with:
          context: bots/osbot
          platforms: ${{ matrix.platform }}
          build-args: |
            BOT_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.BOT_OSBOT_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bot-osbot-${{ matrix.arch }}
          cache-to: type=gha,scope=bot-osbot-${{ matrix.arch }},mode=max

      - name: Export digests
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          BOT_DIGEST: ${{ steps.bot.outputs.digest }}
          OSBOT_DIGEST: ${{ steps.osbot.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/web" "$RUNNER_TEMP/digests/migrate" "$RUNNER_TEMP/digests/bot-expenses" "$RUNNER_TEMP/digests/bot-osbot"
          touch "$RUNNER_TEMP/digests/web/${WEB_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/migrate/${MIGRATE_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/bot-expenses/${BOT_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/bot-osbot/${OSBOT_DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          publish() {
            local image="$1" dir="$2"
            local refs=()
            for digest in "$RUNNER_TEMP/digests/$dir"/*; do
              refs+=("$image@sha256:$(basename "$digest")")
            done
            [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests for $image, got ${#refs[@]}"; exit 1; }
            docker buildx imagetools create -t "$image:$SHA" -t "$image:latest" "${refs[@]}"
            docker buildx imagetools inspect "$image:$SHA"
          }
          publish "$WEB_IMAGE" web
          publish "$MIGRATE_IMAGE" migrate
          publish "$BOT_EXPENSES_IMAGE" bot-expenses
          publish "$BOT_OSBOT_IMAGE" bot-osbot

  deploy:
    name: Deploy to server
    needs: [plan, merge]
    # Runs after a successful build, or straight away for a manual redeploy of
    # an existing sha (build/merge skipped).
    if: >-
      always() &&
      needs.plan.outputs.deploy == 'true' &&
      (needs.merge.result == 'success' ||
       (needs.plan.outputs.build == 'false' && needs.merge.result == 'skipped'))
    runs-on: ubuntu-24.04
    # Lets you add protection rules (required reviewers) in repo settings. Keep
    # the DEPLOY_* secrets at repository level: the plan job checks for them.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; trusting the host key on first use."
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run infra/deploy.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.plan.outputs.sha }}
        # With the recommended forced command (infra/ci-gate.sh) the server only
        # accepts "deploy <sha>"-style commands; without it this runs the script
        # directly. Either way the server checks the sha is on main.
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/anwar-os/repo/infra/deploy.sh $SHA"

      - name: Smoke test
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/api/health"

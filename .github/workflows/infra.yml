name: Infra

# Static checks for the server files: shellcheck for every script, compose and
# Caddyfile validation. Cheap, and runs only when infra changes.

on:
  pull_request:
    paths: ["infra/**", "Dockerfile", ".dockerignore", "db/init/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "Dockerfile", ".dockerignore", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  check:
    name: shellcheck, compose, Caddyfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck --version && shellcheck -x infra/*.sh infra/backup/*.sh

      - name: compose config
        run: |
          cp infra/.env.example infra/.env
          sed -i -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
                 -e 's/^OS_APP_PASSWORD=$/OS_APP_PASSWORD=ci/' \
                 -e 's/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=ci/' infra/.env
          docker compose -f infra/compose.prod.yml --env-file infra/.env config --quiet
          COMPOSE_PROFILES=bots,ops docker compose -f infra/compose.prod.yml --env-file infra/.env config --quiet
          ACME_EMAIL=ci@example.com docker compose -f infra/edge/compose.yml config --quiet

      - name: Caddyfile
        # The edge Caddyfile with every site template rendered, as on a server
        # hosting anwar.os and a static SPA next to it.
        run: |
          mkdir -p /tmp/sites
          sed 's/__DOMAIN__/anwar-os.com/g' infra/edge/sites/anwar-os.caddy.tmpl > /tmp/sites/anwar-os.caddy
          sed -e 's|__DOMAIN__|shiftella.app|g' -e 's|__ROOT__|shiftella/prod/current|g' \
            infra/edge/sites/static-spa.caddy.tmpl > /tmp/sites/shiftella.caddy
          docker run --rm -e ACME_EMAIL=ci@example.com \
            -v "$PWD/infra/edge:/etc/caddy/base:ro" -v /tmp/sites:/etc/caddy/sites:ro \
            caddy:2.10-alpine caddy validate --config /etc/caddy/base/Caddyfile --adapter caddyfile

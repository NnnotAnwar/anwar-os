name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: nothing connects to a database during the build.
      DATABASE_URL: postgres://os_app:ci@127.0.0.1:55432/anwar_os
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  bots:
    name: Bot tests (${{ matrix.bot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [expenses, osbot]
    defaults:
      run:
        working-directory: bots/${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.7"
      - run: uv sync --frozen
      - run: uv run pytest -q

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      OS_APP_PASSWORD: ci
      DATABASE_URL: postgres://os_app:ci@127.0.0.1:55432/anwar_os
      MIGRATION_DATABASE_URL: postgres://postgres:ci@127.0.0.1:55432/anwar_os
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres image and role setup as local development.
      - run: docker compose up -d --wait db
      - run: pnpm db:migrate
      - run: pnpm test:db

  e2e:
    name: Browser tests (Playwright)
    # Pinned: Playwright 1.60 has no browser builds for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # A failing browser test fails the run, like the other jobs.
    continue-on-error: false
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Cache the Next.js build
        uses: actions/cache@v5.1.0
        with:
          path: .next/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Own Postgres container, next build && next start on :3304, seeded owner,
      # Playwright, cleanup (scripts/e2e.mts).
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ops-agent:
    name: ops-agent (Go unit + Docker integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ops-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: services/ops-agent/go.mod
          cache: false # no dependencies to cache
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags integration ./...
      - run: go test ./...
      # Throwaway labelled alpine containers against the runner's Docker.
      - run: go test -tags integration -run Integration -count=1 -v .

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: nothing connects to a database during the build.
      DATABASE_URL: postgres://os_app:ci@127.0.0.1:55432/anwar_os
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  bots:
    name: Bot tests (${{ matrix.bot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The expense bot's database tests skip without TEST_DATABASE_URL.
        bot: [expenses, osbot]
    defaults:
      run:
        working-directory: bots/${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
      - run: uv sync --frozen
      - run: uv run pytest -q

  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      OS_APP_PASSWORD: ci
      DATABASE_URL: postgres://os_app:ci@127.0.0.1:55432/anwar_os
      MIGRATION_DATABASE_URL: postgres://postgres:ci@127.0.0.1:55432/anwar_os
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres image and role setup as local development.
      - run: docker compose up -d --wait db
      - run: pnpm db:migrate
      - run: pnpm test:db

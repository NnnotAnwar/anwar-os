[project]
name = "expenses-bot"
version = "0.2.0"
description = "Telegram expense tracker bot for anwar.os (aiogram 3 + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.32.0",
    "asyncpg==0.32.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
# Not an installable package: the bot runs as `python -m expenses_bot` from this folder.
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
